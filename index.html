<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#1f2937"
    >

    <meta
        name="description"
        content="Gestion du matériel de la caserne"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="CIS Le Chesne"
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="apple-touch-icon"
        href="./apple-touch-icon.png"
    >

    <title>CIS Le Chesne</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <!--
        Écran de démarrage neutre.
        On n'affiche plus l'ancien accueil en HTML avant que
        l'application ait terminé l'authentification.
    -->
    <div id="app">
        <div
            id="ecran-demarrage"
            aria-label="Chargement de l'application"
        ></div>
    </div>


    <!--
        Bibliothèque officielle Supabase.
        Elle doit être chargée AVANT app.js.
    -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- Configuration Supabase -->
    <script src="./supabase-config.js"></script>


    <!-- Application -->
    <script src="./app.js"></script>


</body>

</html>
